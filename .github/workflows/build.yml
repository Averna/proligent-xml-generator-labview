---
# GitHub Workflow doc:
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions

name: Build

on:
  push:
    branches:
      - "**"

jobs:
  test-vipm:
    runs-on: ubuntu-latest
    container:
      image: nationalinstruments/labview:2025q3patch1-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install VIPM
        run: |
          wget \
            --output-document /tmp/vipm.deb \
            https://packages.jki.net/vipm/preview/vipm_latest_preview_amd64.deb
          sudo dpkg --install /tmp/vipm.deb
          rm /tmp/vipm.deb
      - name: Activate VIPM
        run: |
          vipm activate \
            --serial-number "${{ secrets.VIPM_SERIAL_NUMBER }}" \
            --name "${{ secrets.VIPM_FULL_NAME }}" \
            --email "${{ secrets.VIPM_EMAIL }}"
