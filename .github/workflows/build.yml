---
# GitHub Workflow doc:
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions

name: Build

on:
  push:
    branches:
      - "**"

jobs:
  test-vipm:
    runs-on: ubuntu-latest
    container:
      image: nationalinstruments/labview:2025q3patch1-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install VIPM
        run: |
          apt-get update -y
          apt-get install -y curl
          curl \
            --fail \
            --location \
            --output /tmp/vipm.deb \
            https://packages.jki.net/vipm/preview/vipm_latest_preview_amd64.deb
          dpkg --install /tmp/vipm.deb
          rm /tmp/vipm.deb
      - name: Refresh package list
        run: vipm package-list-refresh
      - name: Install required packages
        run: |
          vipm install \
            oglib_boolean
